name: Pull request checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          .venv/bin/python -m pip check
      - name: Check formatting
        run: .venv/bin/python -m ruff format --check .
      - name: Lint
        run: .venv/bin/python -m ruff check .
      - name: Check types
        run: .venv/bin/python -m mypy
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SPACE_CORP_TEST_POSTGRES_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          .venv/bin/python -m pip check
      - name: Install PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17
      - name: Prepare isolated databases and roles
        run: bash scripts/ci_postgresql.sh
      - name: Run complete suite including migrations and provisioning
        run: .venv/bin/python -m pytest --require-integration -q
      - name: Stop temporary PostgreSQL
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/space-corp-pg/data/postmaster.pid" ]; then
            "$SPACE_CORP_TEST_POSTGRES_BIN/pg_ctl" -D "$RUNNER_TEMP/space-corp-pg/data" -m immediate -w stop
          fi
