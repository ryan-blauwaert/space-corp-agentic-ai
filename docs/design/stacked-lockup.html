#sc-compact .board {background:white;padding:24px;margin-bottom:16px;}
#sc-compact .label {font:12px/1.5 system-ui,sans-serif;color:#555;letter-spacing:.035em;}
#sc-compact .mark {position:relative;display:block;flex:none;width:112px;aspect-ratio:1160/560;overflow:hidden;}
#sc-compact .mark::before {content:'';position:absolute;width:108.10345%;height:223.92857%;left:-3.44828%;top:-57.14286%;background-image:var(--logo);background-size:100% 100%;}
#sc-compact .lock {display:flex;align-items:center;justify-content:center;gap:8px;padding:30px 0;}
#sc-compact .name {font-family:var(--face);font-weight:var(--weight);font-size:clamp(19px,5.1vw,40px);line-height:1;letter-spacing:-.045em;word-spacing:-.08em;white-space:nowrap;}
#sc-compact .stack {flex-direction:column;gap:0px;padding:20px 0 20px;}
#sc-compact .stack .mark {width:170px;}
#sc-compact .stack .name {font-size:28px;}
#sc-compact .status {font:12px/1.5 system-ui,sans-serif;color:#555;}
@media(max-width:480px){#sc-compact .board{padding:20px 12px;}#sc-compact .lock:not(.stack) .mark{width:76px;}#sc-compact .lock:not(.stack){gap:6px;}#sc-compact .stack .name{font-size:26px;}}
#sc-compact .lock.bottom {align-items:flex-end;}
#sc-compact .lock.bottom .name {transform:translateY(.12em);}
</style>
<div id="sc-compact" aria-label="R2 stacked lockup with tighter logo-to-name spacing">
 <section class="board" style="--face:'Orbitron',sans-serif;--weight:900" aria-label="R2 Orbitron Black lockups">
  <div class="label">APPROVED / STACKED LOCKUP</div><div class="lock stack"><span class="mark" role="img" aria-label="Unchanged O2 logo"></span><span class="name">SPACE CORP</span></div>
 </section>
 <section class="board">
  <div class="label">INTERFACE TYPE / SPACE GROTESK · UNCHANGED</div>
  <p style="font-size:16px;line-height:1.5;margin:12px 0">Maintenance overview · Work orders · View evidence</p>
  <div class="status" role="status" id="sc-compact-status">Loading specimen fonts…</div>
 </section>
</div>
<script>
(()=>{
const root=document.getElementById('sc-compact');
Promise.all(['400 40px "Russo One"','900 40px Orbitron','400 16px "Space Grotesk"'].map(f=>document.fonts.load(f))).then(r=>{document.getElementById('sc-compact-status').textContent=r.every(x=>x.length)?'Orbitron Black · Approved stacked lockup':'Some fonts unavailable; fallback lettering may be shown.';}).catch(()=>{document.getElementById('sc-compact-status').textContent='Fonts unavailable; fallback lettering may be shown.';});
})();
</script>
