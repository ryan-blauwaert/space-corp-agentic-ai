[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "space-corp-agentic-ai"
version = "0.1.0"
description = "A production-style agentic AI operations platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1.0",
    "pydantic-settings>=2.15,<3.0",
    "uvicorn>=0.52,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3.0",
    "pytest>=9.1,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
