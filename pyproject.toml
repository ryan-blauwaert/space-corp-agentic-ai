[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "space-corp-agentic-ai"
version = "0.1.0"
description = "A production-style agentic AI operations platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.141,<1.0",
    "openai>=2.54,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn>=0.52,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3.0",
    "pytest>=9.1,<10.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pip-tools==7.6.1",
    # SQLAlchemy needs this on Linux; include it when locking on macOS too.
    "greenlet>=3.0,<4.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
markers = [
    "integration: requires isolated PostgreSQL URLs or opt-in disposable server binaries",
]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["app", "scripts"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
explicit_package_bases = true
